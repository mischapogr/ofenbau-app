# Production-style build + serve, locally verifiable.
#   docker compose -f docker-compose.prod.yml up -d --build
#   → static site served by nginx on http://localhost:8080
services:
  web:
    container_name: ofenbau-web
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        BUILD_MODE: ${BUILD_MODE:-production}
        VITE_TIER: ${VITE_TIER:-premium}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-Ofenbau Mustermann}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:8080}
        VITE_DEMO_PROTECTION_ENABLED: ${VITE_DEMO_PROTECTION_ENABLED:-false}
        VITE_DEMO_CUSTOMER_NAME: ${VITE_DEMO_CUSTOMER_NAME:-Demo Interessent}
        VITE_DEMO_AUTHOR_NAME: ${VITE_DEMO_AUTHOR_NAME:-Mischa Pogrebnyak}
        VITE_DEMO_AUTHOR_EMAIL: ${VITE_DEMO_AUTHOR_EMAIL:-66591935+mischapogr@users.noreply.github.com}
        VITE_DEMO_COPYRIGHT_NOTICE: ${VITE_DEMO_COPYRIGHT_NOTICE:-Urheberrechtlich geschuetzte Demo. Nutzung nur zur internen Pruefung. Kopieren, Weitergabe, Nachbau und produktive Verwendung sind ohne schriftliche Freigabe untersagt.}
        VITE_DEMO_ALLOWED_HOSTS: ${VITE_DEMO_ALLOWED_HOSTS:-localhost,127.0.0.1}
        VITE_DEMO_WATERMARK_ENABLED: ${VITE_DEMO_WATERMARK_ENABLED:-true}
        VITE_DEMO_ACCESS_CODE_HASH: ${VITE_DEMO_ACCESS_CODE_HASH:-}
        VITE_DEMO_OBFUSCATE: ${VITE_DEMO_OBFUSCATE:-true}
        VITE_DEMO_OBFUSCATE_AGGRESSIVE: ${VITE_DEMO_OBFUSCATE_AGGRESSIVE:-false}
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    container_name: ofenbau-contact-api
    build:
      context: .
      dockerfile: Dockerfile.contact
    environment:
      PORT: 3000
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-no-reply@ofenbau-mustermann.test}
      MAIL_TO: ${MAIL_TO:-info@ofenbau-mustermann.test}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-8000}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
